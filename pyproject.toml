[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxspot"
version = "0.1.0"
description = "Deciphering Stellar Surface with Transformer"
authors = [
    { name = "Kai Ikuta" }
]
requires-python = ">=3.8"

dependencies = [
    "jax",
    "flax",
    "optax"
]

[tool.setuptools.packages.find]
where = ["src"]
