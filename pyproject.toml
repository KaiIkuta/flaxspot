[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flaxspot"
version = "0.1.0"
description = "flaxspot: Deciphering Stellar Surface with Transformer"
readme = "README.md"
authors = [
    { name = "Kai Ikuta" }
]
requires-python = ">=3.10"
dependencies = [
    "jax>=0.4.20",
    "flax>=0.8.0",
    "optax>=0.1.7",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "scikit-learn>=1.2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
